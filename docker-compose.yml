services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wms_postgres
    environment:
      POSTGRES_DB: wms_api_layer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kunal
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wms_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_api
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DB_ENV=local
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=kunal
      - DB_DATABASE=wms_api_layer
      - SECRET_TOKEN=your-super-secret-alphanumeric-token-d8f7g6h5j4k3l2
      - REQUIRED_VERSION=2.1.3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wms_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  wms_network:
    driver: bridge
